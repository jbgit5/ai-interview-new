services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-interview-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_interview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    volumes:
      - ai_interview_local_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_interview"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ai_interview_local_db_data:
